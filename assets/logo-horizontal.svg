<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="amberH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="iconBgH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <filter id="shadowH" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- ICON CONTAINER (Left) -->
  <g transform="translate(15, 15)">
    <!-- Squircle Background -->
    <rect width="190" height="190" rx="46" fill="url(#iconBgH)" stroke="#334155" stroke-width="1.5" />

    <!-- Countdown Arc Ring -->
    <circle cx="95" cy="95" r="74" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round" opacity="0.4" />
    <circle cx="95" cy="95" r="74" fill="none" stroke="url(#amberH)" stroke-width="6" stroke-linecap="round" stroke-dasharray="465" stroke-dashoffset="140" />
    
    <!-- Accent Dot -->
    <circle cx="160" cy="65" r="5" fill="#FCD34D" />

    <!-- Pin Symbol with Doorway -->
    <g transform="translate(95, 92) scale(0.38) translate(-256, -240)" filter="url(#shadowH)">
      <!-- Pin Outline -->
      <path d="M 256 90 
               C 178 90, 116 152, 116 230 
               C 116 312, 230 405, 250 420 
               C 254 423, 258 423, 262 420 
               C 282 405, 396 312, 396 230 
               C 396 152, 334 90, 256 90 Z" 
            fill="#0F172A" 
            stroke="url(#amberH)" 
            stroke-width="18" 
            stroke-linejoin="round" />

      <!-- Arch Doorway -->
      <path d="M 195 295 V 220 C 195 186, 222 158, 256 158 C 290 158, 317 186, 317 220 V 295 Z" fill="#020617" />
      
      <!-- Gate Doors -->
      <path d="M 205 285 L 235 272 V 195 L 205 208 Z" fill="url(#amberH)" />
      <path d="M 307 285 L 277 272 V 195 L 307 208 Z" fill="url(#amberH)" />
      <circle cx="256" cy="225" r="10" fill="#FCD34D" />
    </g>
  </g>

  <!-- TYPOGRAPHY / WORDMARK (Right) -->
  <g transform="translate(235, 115)">
    <!-- "No" in Crisp White / Dark Navy Slate depending on bg -->
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Inter', sans-serif" font-size="78" font-weight="900" fill="#0F172A" letter-spacing="-1.5">No</text>
    
    <!-- "Portão" in Amber Gold -->
    <text x="118" y="0" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Inter', sans-serif" font-size="78" font-weight="900" fill="url(#amberH)" letter-spacing="-1.5">Portão</text>

    <!-- Tagline & Badge -->
    <text x="5" y="42" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="20" font-weight="600" fill="#64748B" letter-spacing="1.2">PONTUALIDADE NO TRANSPORTE ESCOLAR</text>

    <!-- Micro Badge Pill -->
    <g transform="translate(5, 58)">
      <rect width="180" height="26" rx="13" fill="#FEF3C7" />
      <circle cx="14" cy="13" r="5" fill="#D97706" />
      <text x="26" y="17" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="12" font-weight="700" fill="#92400E" letter-spacing="0.5">CHEGOU • EMBARCOU</text>
    </g>
  </g>
</svg>
