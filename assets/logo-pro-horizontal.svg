<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 180" width="100%" height="100%">
  <!-- Left: The Minimalist Symbol (scale 0.32) -->
  <g transform="translate(20, 20)">
    <rect width="140" height="140" rx="36" fill="#0B1120" />
    <g transform="translate(70, 68) scale(0.26)">
      <!-- Outer Location Pin Shape -->
      <path d="M 0 -150 C -85 -150, -150 -85, -150 0 C -150 75, -50 160, -8 200 C -4 204, 4 204, 8 200 C 50 160, 150 75, 150 0 C 150 -85, 85 -150, 0 -150 Z" fill="#FFB800" />
      <!-- Arch Cutout -->
      <path d="M -54 50 V -20 C -54 -50, -24 -74, 0 -74 C 24 -74, 54 -50, 54 -20 V 50 Z" fill="#0B1120" />
      <!-- Clock Precision Accent -->
      <circle cx="0" cy="-20" r="14" fill="#FFFFFF" />
      <path d="M 0 -20 L 0 -50" stroke="#FFB800" stroke-width="5" stroke-linecap="round" />
      <path d="M 0 -20 L 22 -20" stroke="#FFB800" stroke-width="5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Right: Crisp Modern Typography -->
  <g transform="translate(190, 105)">
    <!-- NoPortão Wordmark -->
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Inter', sans-serif" font-size="64" font-weight="800" fill="#0B1120" letter-spacing="-1.5">
      No<tspan fill="#FFB800">Portão</tspan>
    </text>
    
    <!-- Slogan / Category -->
    <text x="4" y="32" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="16" font-weight="600" fill="#64748B" letter-spacing="1">
      PONTUALIDADE NO TRANSPORTE ESCOLAR
    </text>
  </g>
</svg>
