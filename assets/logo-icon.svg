<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Amber Gold Gradient (School & Energy) -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Clock Glow / Accent -->
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="glowAmber" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#F59E0B" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- App Icon Base: Rounded Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.4" />

  <!-- Outer Countdown Arc (Representing Time / Punctuality Ring) -->
  <circle cx="256" cy="230" r="160" fill="none" stroke="#1E293B" stroke-width="12" stroke-linecap="round" />
  <circle cx="256" cy="230" r="160" fill="none" stroke="url(#amberGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="1005" stroke-dashoffset="320" filter="url(#glowAmber)" />

  <!-- Speed/Countdown Dots -->
  <circle cx="395" cy="150" r="8" fill="#FCD34D" filter="url(#glowAmber)" />
  <circle cx="416" cy="230" r="6" fill="#F59E0B" opacity="0.8" />
  <circle cx="395" cy="310" r="5" fill="#D97706" opacity="0.6" />

  <!-- Main Symbol: The Pin + Gate Fusion -->
  <g filter="url(#shadow)">
    <!-- Pin Body (Stylized Location Pin) -->
    <path d="M 256 90 
             C 178 90, 116 152, 116 230 
             C 116 312, 230 405, 250 420 
             C 254 423, 258 423, 262 420 
             C 282 405, 396 312, 396 230 
             C 396 152, 334 90, 256 90 Z" 
          fill="#1E293B" 
          stroke="url(#amberGrad)" 
          stroke-width="14" 
          stroke-linejoin="round" />

    <!-- Interior Portal / Portão (The Open Gate) -->
    <!-- Doorway Arch Background -->
    <path d="M 195 295 
             V 220 
             C 195 186, 222 158, 256 158 
             C 290 158, 317 186, 317 220 
             V 295 Z" 
          fill="#0F172A" />

    <!-- Gate Pillars & Arch Structure -->
    <path d="M 195 295 
             V 220 
             C 195 186, 222 158, 256 158 
             C 290 158, 317 186, 317 220 
             V 295" 
          fill="none" 
          stroke="#475569" 
          stroke-width="6" 
          stroke-linecap="round" />

    <!-- Left Gate Leaf (Open slightly inward/perspective) -->
    <path d="M 205 285 L 235 272 V 195 L 205 208 Z" fill="url(#amberGrad)" opacity="0.95" />
    <line x1="220" y1="202" x2="220" y2="278" stroke="#78350F" stroke-width="3" stroke-linecap="round" />

    <!-- Right Gate Leaf (Open outward welcoming) -->
    <path d="M 307 285 L 277 272 V 195 L 307 208 Z" fill="url(#amberGrad)" opacity="0.95" />
    <line x1="292" y1="202" x2="292" y2="278" stroke="#78350F" stroke-width="3" stroke-linecap="round" />

    <!-- Golden Pathway / Welcome Beam flowing through the gate -->
    <polygon points="256,220 238,320 274,320" fill="url(#amberGrad)" opacity="0.25" />
    <circle cx="256" cy="225" r="9" fill="#FCD34D" filter="url(#glowAmber)" />
  </g>
</svg>
